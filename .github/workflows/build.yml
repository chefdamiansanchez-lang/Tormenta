name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Instalar Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK
        shell: bash
        run: |
          gradle assembleDebug --console=plain > build.log 2>&1 || {
            echo "---- ultimas lineas ----"
            tail -25 build.log
            echo "======== CAUSA DEL ERROR ========"
            grep -A 12 "What went wrong" build.log | head -40
            exit 1
          }
          tail -5 build.log

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: App v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
